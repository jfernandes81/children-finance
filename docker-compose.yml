services:
  backend:
    build: ./backend
    container_name: poupadinha-api
    restart: unless-stopped
    environment:
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:-poupadinha-change-me-in-production}
    volumes:
      - poupadinha-data:/app/data
    expose:
      - "3001"

  frontend:
    build: ./frontend
    container_name: poupadinha-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

  # Proxy na porta 80 para http://poupadinha.home
  # Uso: docker compose --profile gateway up -d
  # Requer que outras apps na :80 passem para outra porta (ex. 8081)
  gateway:
    profiles: ["gateway"]
    image: nginx:1.27-alpine
    container_name: poupadinha-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend

volumes:
  poupadinha-data:
